fragment CardFields on Asset {
  id
  headline
  type
  initialPublishDate
  promoBrief
  ssts {
    section
  }
  contributors {
    ... on BaseContributors {
      contributorId
      contributor {
        byline
      }
    }
  }
  links {
    photo {
      ... on image {
        crops {
          name
          path
          width
          height
        }
      }
    }
  }
}
